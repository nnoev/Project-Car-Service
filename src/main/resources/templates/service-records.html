<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Records - Car Service</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }

        .navbar {
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #333;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8f9fa;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #ddd;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #ddd;
        }

        tbody tr:hover {
            background-color: #f8f9fa;
        }

        .record-vehicle {
            color: #667eea;
            font-weight: 600;
        }

        .record-date {
            color: #666;
        }

        .record-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: #e8f4f8;
            color: #2980b9;
            font-size: 12px;
            font-weight: 600;
        }

        .record-cost {
            color: #27ae60;
            font-weight: 600;
        }

        .record-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn-info {
            background: #3498db;
            color: white;
        }

        .btn-info:hover {
            background: #2980b9;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background: #c0392b;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-state-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .empty-state h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .empty-state p {
            color: #999;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .table-container {
                overflow-x: auto;
            }
        }
        .alert.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">🚗 Car Service</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/service-records">Service Records</a>
        <a href="/reminders">Reminders</a>
        <a href="/profile">Profile</a>
        <form action="/logout" method="post" style="display: inline;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>Service Records</h1>
        <a href="/service-records/add" class="btn btn-primary">+ Add Record</a>
    </div>
    <div class="alert success" th:if="${message}">
        <strong>Success!</strong>
        <span th:text="${message}"></span>
    </div>

    <div class="table-container" th:if="${!user.getServiceRecords().isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Vehicle</th>
                <th>Service Type</th>
                <th>Date</th>
                <th>Mileage</th>
                <th>Cost</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="record : ${user.getServiceRecords()}">
                <td>
                    <span class="record-vehicle"
                          th:text="${record.vehicle.year} + ' ' + ${record.vehicle.make} + ' ' + ${record.vehicle.model}"></span>
                </td>
                <td>
                    <span class="record-type" th:text="${record.serviceType}"></span>
                </td>
                <td>
                    <span class="record-date" th:text="${#temporals.format(record.date, 'MMM dd, yyyy')}"></span>
                </td>
                <td th:text="${record.mileageAtService} + ' kilometers'"></td>
                <td>
                    <span class="record-cost" th:text="'€' + ${#numbers.formatDecimal(record.cost, 1, 2)}"></span>
                </td>
                <td th:text="${record.description}"></td>
                <td>
                    <div class="record-actions">
                        <a th:href="@{/service-records/edit/{id}(id=${record.id})}" class="btn btn-sm btn-info">Edit</a>
                        <form th:action="@{/service-records/delete/{id}(id=${record.id})}" method="post">
                            <button
                                    class="btn btn-sm btn-danger"
                                    onclick="return confirm('Are you sure you want to delete this reminder?')">
                                Delete
                            </button>                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="empty-state" th:if="${user.getServiceRecords().isEmpty()}">
        <div class="empty-state-icon">🔧</div>
        <h2>No service records yet</h2>
        <p>Track your vehicle maintenance by adding your first service record</p>
        <a href="/service-records/add" class="btn btn-primary">Add Service Record</a>
    </div>
</div>

</body>
</html>
