<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${serviceRecord.id != null ? 'Edit' : 'Add'} + ' Service Record - Car Service'"></title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f7fa;
            color: #333;
        }

        .navbar {
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 60px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-size: 24px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .container {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .form-container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .form-title {
            font-size: 24px;
            margin-bottom: 25px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-actions {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
            text-align: center;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #ecf0f1;
            color: #333;
        }

        .btn-secondary:hover {
            background: #d5dbdb;
        }

        .error-message {
            color: #e74c3c;
            font-size: 13px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
<nav class="navbar">
    <div class="navbar-logo">🚗 Car Service</div>
    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/vehicles">Vehicles</a>
        <a href="/service-records">Service Records</a>
        <a href="/reminders">Reminders</a>
        <a href="/profile">Profile</a>
        <form action="/logout" method="post" style="display: inline;">
            <button type="submit" class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <div class="form-container">
        <h1 class="form-title" th:text="${serviceRecord.id != null ? 'Edit Service Record' : 'Add New Service Record'}"></h1>

        <form th:action="${serviceRecord.id != null ? '/service-records/' + serviceRecord.id + '/edit' : '/service-records/add'}"
              method="post"
              th:object="${serviceRecord}">

            <div class="form-group">
                <label for="vehicle">Vehicle *</label>
                <select id="vehicle" name="vehicle.id" th:field="*{vehicle.id}" required>
                    <option value="">-- Select Vehicle --</option>
                    <option th:each="vehicle : ${vehicles}"
                            th:value="${vehicle.id}"
                            th:text="|${vehicle.year} ${vehicle.make} ${vehicle.model}|"></option>
                </select>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="serviceDate">Service Date *</label>
                    <input type="date" id="serviceDate" name="serviceDate" th:field="*{serviceDate}" required>
                </div>

                <div class="form-group">
                    <label for="serviceType">Service Type *</label>
                    <input type="text" id="serviceType" name="serviceType" th:field="*{serviceType}"
                           placeholder="e.g., Oil Change, Tire Rotation" required>
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" th:field="*{description}"
                          placeholder="Additional details about the service..."></textarea>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cost">Cost *</label>
                    <input type="number" id="cost" name="cost" th:field="*{cost}"
                           min="0" step="0.01" placeholder="0.00" required>
                </div>

                <div class="form-group">
                    <label for="mileageAtService">Mileage at Service *</label>
                    <input type="number" id="mileageAtService" name="mileageAtService"
                           th:field="*{mileageAtService}" min="0" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" th:text="${serviceRecord.id != null ? 'Update Record' : 'Add Record'}"></button>
                <a href="/service-records" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
