<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard – Car Service</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .navbar {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 0 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .navbar-logo {
            font-size: 22px;
            font-weight: bold;
            color: #667eea;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #666;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #667eea;
        }

        .btn-logout {
            background: #e74c3c;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        h1 {
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card-title {
            font-size: 16px;
            color: #666;
        }

        .card-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <div class="navbar-logo">🚗 Admin Panel</div>

    <div class="nav-links">
        <a href="/admin">Dashboard</a>
        <a href="/admin/users">Users</a>
        <a href="/admin/vehicles">Vehicles</a>
        <a href="/admin/services">Services</a>
        <a href="/admin/reminders">Reminders</a>
        <a href="/admin/logs">Logs</a>

        <form action="/logout" method="post" style="display:inline;">
            <button class="btn-logout">Logout</button>
        </form>
    </div>
</nav>

<div class="container">
    <h1>Admin Dashboard</h1>
    <p>System overview and statistics</p>

    <div class="grid">
        <div class="card">
            <div class="card-title">Total Users</div>
            <div class="card-value" th:text="${stats.users}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Total Vehicles</div>
            <div class="card-value" th:text="${stats.vehicles}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Service Records</div>
            <div class="card-value" th:text="${stats.services}">0</div>
        </div>

        <div class="card">
            <div class="card-title">Reminders</div>
            <div class="card-value" th:text="${stats.reminders}">0</div>
        </div>
    </div>
</div>

</body>
</html>
